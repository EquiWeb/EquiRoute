[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[project]
name = "equiroute"
version = "0.1.0"
description = "Structured-output router fine-tuning framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11.2,<2.13",
    "PyYAML>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
model = [
    "accelerate",
    "peft",
    "torch",
    "transformers",
]
labeling = [
    "openrouter>=1.3.20,<2",
]

[project.scripts]
equiroute = "equiroute.cli:app"

[tool.uv]
default-groups = ["dev", "test"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "ruff>=0.9",
    "types-PyYAML>=6.0.12",
]
test = [
    "pytest>=8",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
follow_imports = "skip"
