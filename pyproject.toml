[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[project]
name = "equiroute"
version = "0.1.0"
description = "Structured-output router fine-tuning framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
model = [
    "torch",
    "transformers",
]

[project.scripts]
equiroute = "equiroute.cli:app"

[tool.uv]
default-groups = ["test"]

[dependency-groups]
test = [
    "pytest>=8",
]
